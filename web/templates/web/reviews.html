{% extends 'web/base.html' %}
{% load static %}
{% block title %}Отзывы покупателей{% endblock %}
{% block body_class %}reviews-page{% endblock %}
{% block content %}
<section class="card reviews-card">
  <p class="eyebrow">Реальные впечатления</p>
  <h1>Отзывы покупателей</h1>
  <img class="review-image" src="{% static 'web/reviews/1787547870943.jpg' %}" alt="Изображение из отзыва покупателя">

  <article class="review-message">
    <h2>1. Пользователь из Саратова</h2>
    <div class="voice-message">
      <audio class="voice-audio" controls preload="metadata" aria-label="Голосовое сообщение пользователя из Саратова" data-voice-audio>
        <source src="{% static 'web/reviews/2_5217695076280474580.ogg' %}" type="audio/ogg">
        Ваш браузер не поддерживает воспроизведение аудио.
      </audio>
    </div>
  </article>
</section>
{% endblock %}
